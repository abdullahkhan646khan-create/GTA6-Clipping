# Render Blueprint — FREE plan version.
# Engine = free Web Service (all agents + built-in 10-min heartbeat + /health endpoint).
# Keep-alive: Supabase pings /health every 10 min (supabase/migrations/003_keepalive.sql) so it never sleeps.
services:
  - type: web
    name: clipforge-engine
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BUFFER_API_KEY
        sync: false
      - key: BUFFER_CHANNEL_ID
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YTDLP_COOKIES_B64
        sync: false
      - key: YTDLP_PROXY
        sync: false
      - key: GITHUB_REPO
        value: abdullahkhan646khan-create/GTA6-Clipping
      - key: GITHUB_WAKE_ISSUE
        value: "1"
      - key: WAKE_METHOD
        value: github_issue
      - key: LIGHT_MODE
        value: "1"
      - key: NODE_NAME
        value: engine-free

  - type: web
    name: clipforge-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: echo "window.CF_CONFIG={url:'$SUPABASE_URL',anon:'$SUPABASE_ANON_KEY'};" > config.js
    staticPublishPath: .
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
